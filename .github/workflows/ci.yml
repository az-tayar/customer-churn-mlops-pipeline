name: Customer Churn CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Miniconda
      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.13"
          auto-activate-base: true

      # 3. CI dependencies
      - name: Install CI dependencies
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==3.3.2
          pip install flake8
          pip install wandb==0.22.3

      # 4. W&B authentication
      - name: Configure W&B
        shell: bash -el {0}
        run: |
          if [ -z "$WANDB_API_KEY" ]; then
            echo "WANDB_API_KEY is not available"
            exit 1
          fi
          wandb login --verify "$WANDB_API_KEY"

      # 5. Lint
      - name: Run Flake8
        shell: bash -el {0}
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      # 6. Data tests
      - name: Run data tests
        shell: bash -el {0}
        run: |
          mlflow run . -P steps="'test_data'"

      # 7. Model tests
      - name: Run model tests
        shell: bash -el {0}
        run: |
          mlflow run . -P steps="'test_model'"

      # 8. API tests
      - name: Run API tests
        shell: bash -el {0}
        run: |
          mlflow run . -P steps="'test_api'"